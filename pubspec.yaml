name: custom_cursor_with_icon
description: A Flutter TextField widget with an animated cursor that displays a customizable icon below the caret. Fully configurable cursor appearance, blinking behavior, and icon placement.
version: 0.0.1
homepage: https://github.com/user/custom_cursor_with_icon
repository: https://github.com/user/custom_cursor_with_icon
issue_tracker: https://github.com/user/custom_cursor_with_icon/issues

environment:
  sdk: ^3.11.5
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
