name: custom_cursor_with_icon
description: A Flutter TextField widget with an animated cursor that displays a customizable icon below the caret. Fully configurable cursor appearance, blinking behavior, and icon placement.
version: 1.0.0
homepage: https://github.com/lakshya1goel/custom_cursor_with_icon
repository: https://github.com/lakshya1goel/custom_cursor_with_icon
issue_tracker: https://github.com/lakshya1goel/custom_cursor_with_icon/issues

topics:
  - textfield
  - cursor
  - widget
  - input
  - ui

screenshots:
  - description: 'Custom Cursor TextField examples showing various cursor icons and styles.'
    path: assets/preview_image.jpg

environment:
  sdk: ^3.8.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
